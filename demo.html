<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10141f">
<title>Cuaderno — plan 12 semanas</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root {
  --bg: #0b0f14;
  --surface: #141a21;
  --surface-2: #1b232c;
  --border: rgba(255, 255, 255, 0.09);
  --text: #f1f3f5;
  --text-muted: #8b93a1;
  --accent: #f97316;
  --accent-dim: rgba(249, 115, 22, 0.32);
  --accent-glow: rgba(249, 115, 22, 0.22);
  --good: #22c55e;
  --bad: #ef4444;
  --radius: 14px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Barlow', system-ui, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  padding-bottom: calc(94px + env(safe-area-inset-bottom, 0px));
}

header.app-header {
  padding: 22px 20px 16px;
  border-bottom: 1px solid var(--border);
}

header.app-header .stamp {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent);
  border: 1px solid var(--accent-dim);
  padding: 3px 8px;
  border-radius: 999px;
  margin-bottom: 10px;
}

header.app-header h1 {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 22px;
  font-weight: 700;
  margin: 0;
  letter-spacing: -0.01em;
}

header.app-header p {
  color: var(--text-muted);
  font-size: 13px;
  margin: 4px 0 0;
}

main { padding: 18px 20px 8px; }

section.view { display: none; }
section.view.active { display: block; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 14px;
}

.card h2 {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 15px;
  font-weight: 600;
  margin: 0 0 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.card h2 .tag {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10.5px;
  color: var(--text-muted);
  font-weight: 500;
}

/* ---- Day selector pills ---- */
.pillrow {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 4px;
  margin-bottom: 14px;
  -ms-overflow-style: none;
  scrollbar-width: none;
}
.pillrow::-webkit-scrollbar { display: none; }

.pill {
  flex: 0 0 auto;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  padding: 7px 12px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-muted);
  cursor: pointer;
}
.pill.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #1a1206;
  font-weight: 600;
}

/* ---- Macro summary ---- */
.macro-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.macro-box {
  background: var(--surface-2);
  border-radius: 10px;
  padding: 10px 6px;
  text-align: center;
}
.macro-box .val {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 16px;
  font-weight: 600;
}
.macro-box .lbl {
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-top: 2px;
}
.macro-box.on-target .val { color: var(--good); }
.macro-box.off-target .val { color: var(--bad); }

/* ---- Meal rows ---- */
.meal-row {
  padding: 12px 0;
  border-top: 1px solid var(--border);
}
.meal-row:first-child { border-top: none; padding-top: 0; }
.meal-row .meal-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 4px;
}
.meal-row .meal-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 600;
  font-size: 13.5px;
  color: var(--accent);
}
.meal-row .meal-macro {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11.5px;
  color: var(--text-muted);
}
.meal-row .meal-text {
  font-size: 13.5px;
  line-height: 1.45;
  color: var(--text);
}

/* ---- Workout log ---- */
.exercise-row {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px 16px;
  margin-bottom: 14px;
  position: relative;
}
.exercise-row:last-child { margin-bottom: 0; }
.exercise-row .ex-remove {
  position: absolute;
  top: 14px;
  right: 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-muted);
  width: 32px;
  height: 32px;
  border-radius: 50%;
  font-size: 17px;
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.exercise-row .ex-remove:active { color: var(--bad); border-color: var(--bad); }
.exercise-row .ex-name {
  font-weight: 700;
  font-size: 16px;
  padding-right: 40px;
  margin-bottom: 6px;
  line-height: 1.3;
}
.exercise-row .ex-scheme {
  display: block;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12.5px;
  color: var(--text-muted);
  margin-bottom: 10px;
}
.exercise-row .ex-last {
  font-size: 12.5px;
  color: var(--accent);
  margin-bottom: 12px;
  font-family: 'IBM Plex Mono', monospace;
}
.ex-rest-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px 8px 8px 14px;
  margin-bottom: 12px;
}
.ex-rest-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12.5px;
  color: var(--text-muted);
}
.ex-rest-stepper {
  display: flex;
  align-items: center;
  gap: 10px;
}
.ex-rest-stepper button {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 19px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.ex-rest-stepper button:active { background: var(--accent-dim); }
.ex-rest-value {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 14.5px;
  font-weight: 600;
  min-width: 42px;
  text-align: center;
}

.stopwatch-btn {
  width: 100%;
  margin-top: 10px;
  color: var(--accent);
  border-color: var(--accent-dim);
  padding: 13px;
  font-size: 13px;
  min-height: 46px;
}
.stopwatch-btn.running {
  color: var(--bad);
  border-color: var(--bad);
}

.rest-timer { margin-top: 14px; }
.rest-start-btn {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 10px;
  padding: 14px;
  min-height: 48px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13.5px;
  cursor: pointer;
}
.rest-countdown {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--surface);
  border: 1px solid var(--accent-dim);
  border-radius: 10px;
  padding: 12px 16px;
  min-height: 48px;
}
.rc-time {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 24px;
  font-weight: 600;
  color: var(--accent);
}
.rc-cancel {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-muted);
  border-radius: 6px;
  padding: 9px 14px;
  min-height: 40px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  cursor: pointer;
}
.rc-done {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 15px;
  color: var(--good);
  width: 100%;
  text-align: center;
}
.set-inputs {
  display: flex;
  gap: 10px;
}
.set-inputs input {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 16px;
  padding: 13px 10px;
  min-height: 48px;
  width: 100%;
}
.set-inputs input::placeholder { color: #4d566e; font-size: 13px; }

button.primary {
  width: 100%;
  background: var(--accent);
  color: #1a1206;
  border: none;
  border-radius: 10px;
  padding: 15px;
  min-height: 50px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 0.02em;
  cursor: pointer;
  margin-top: 4px;
  box-shadow: 0 4px 16px var(--accent-glow);
}
button.primary:active { opacity: 0.9; }

button.ghost {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-muted);
  border-radius: 10px;
  padding: 12px;
  min-height: 46px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12.5px;
  cursor: pointer;
}

.add-exercise {
  margin-top: 18px;
  padding-top: 16px;
  border-top: 1px dashed var(--border);
}
.add-exercise-inputs {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 10px;
}
.add-exercise-inputs input {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-family: 'Barlow', sans-serif;
  font-size: 15px;
  padding: 12px 12px;
  min-height: 46px;
  width: 100%;
}
.add-exercise-inputs input::placeholder { color: #4d566e; }
.add-exercise-inputs select {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-family: 'Barlow', sans-serif;
  font-size: 15px;
  padding: 12px 12px;
  min-height: 46px;
  width: 100%;
}

/* ---- Weight log ---- */
.weight-input-row {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}
.weight-input-row input {
  flex: 1;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 15px;
  padding: 10px 12px;
}
.weight-input-row button {
  background: var(--accent);
  color: #1a1206;
  border: none;
  border-radius: 10px;
  padding: 0 18px;
  font-weight: 700;
  cursor: pointer;
}

.chart-wrap { position: relative; height: 150px; margin-bottom: 8px; }
.chart-wrap canvas { width: 100%; height: 100%; }

.trend-readout {
  display: flex;
  justify-content: space-between;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  color: var(--text-muted);
  padding-top: 8px;
  border-top: 1px solid var(--border);
}
.trend-readout b { color: var(--text); }

.weight-history {
  margin-top: 10px;
  max-height: 140px;
  overflow-y: auto;
}
.weight-history .wh-row {
  display: flex;
  justify-content: space-between;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  padding: 6px 0;
  border-top: 1px solid var(--border);
  color: var(--text-muted);
}
.weight-history .wh-row span:last-child { color: var(--text); }

/* ---- Vista semana (Comidas) ---- */
.week-day-block {
  border-top: 1px solid var(--border);
  padding: 12px 0;
}
.week-day-block:first-child { border-top: none; padding-top: 0; }
.week-day-block .wd-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 6px;
}
.week-day-block .wd-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 14px;
}
.week-day-block .wd-macro {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--text-muted);
}
.week-day-block .wd-meals {
  font-size: 12.5px;
  color: var(--text-muted);
  line-height: 1.6;
}
.week-day-block .wd-meals b { color: var(--text); font-weight: 500; }

/* ---- Lista de la compra ---- */
.daycheck-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.daycheck {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 10px 4px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  cursor: pointer;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--text-muted);
}
.daycheck.checked {
  border-color: var(--accent);
  color: var(--accent);
}
.daycheck input { display: none; }
.daycheck .box {
  width: 16px;
  height: 16px;
  border-radius: 4px;
  border: 1.5px solid var(--border);
}
.daycheck.checked .box {
  background: var(--accent);
  border-color: var(--accent);
}

.shop-cat { margin-bottom: 16px; }
.shop-cat:last-child { margin-bottom: 0; }
.shop-cat h3 {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--accent);
  margin: 0 0 8px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
.shop-item {
  display: flex;
  justify-content: space-between;
  font-size: 13.5px;
  padding: 7px 0;
  border-top: 1px solid var(--border);
}
.shop-item:first-child { border-top: none; }
.shop-item .qty {
  font-family: 'IBM Plex Mono', monospace;
  color: var(--text-muted);
  white-space: nowrap;
  margin-left: 12px;
}

.tomorrow-list {
  font-size: 13px;
  color: var(--text-muted);
  line-height: 1.7;
}
.tomorrow-list b { color: var(--text); font-weight: 500; }

.empty-note {
  font-size: 12.5px;
  color: var(--text-muted);
  text-align: center;
  padding: 12px 0;
}

/* ---- Bottom nav ---- */
nav.tabbar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
nav.tabbar button {
  flex: 1;
  background: none;
  border: none;
  color: var(--text-muted);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10.5px;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  padding: 14px 4px 14px;
  min-height: 58px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  -webkit-tap-highlight-color: transparent;
}
nav.tabbar button .tab-icon {
  width: 21px;
  height: 21px;
  flex-shrink: 0;
}
nav.tabbar button.active { color: var(--accent); }
nav.tabbar button.active .tab-icon { filter: drop-shadow(0 0 6px var(--accent-glow)); }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* Feedback táctil: todo elemento tocable reacciona al tap, nunca un cambio instantáneo sin aviso */
button, .pill, .daycheck {
  transition: transform 100ms ease, opacity 100ms ease, background-color 150ms ease, border-color 150ms ease;
}
button:active, .pill:active, .daycheck:active {
  transform: scale(0.96);
}

.icon {
  width: 17px;
  height: 17px;
  flex-shrink: 0;
  vertical-align: -3px;
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

</style>
<style>
  .demo-banner {
    background: #2a1608;
    border-bottom: 1px solid rgba(249,115,22,0.35);
    color: #f97316;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    text-align: center;
    padding: 7px 10px;
    letter-spacing: 0.03em;
  }
</style>
</head>
<body>
<div class="demo-banner">VISTA PREVIA · datos simulados, no se guardan</div>

<header class="app-header">
  <div class="stamp">Ciclo · 12 semanas</div>
  <h1>Cuaderno de entrenamiento</h1>
  <p>Mié / Vie / Sáb entreno · resto descanso + dieta</p>
</header>

<main>

  <!-- ================= HOY ================= -->
  <section class="view active" id="view-hoy">
    <div class="card" id="hoy-resumen"></div>
    <div class="card" id="hoy-comidas"></div>
    <div class="card" id="hoy-manana"></div>
  </section>

  <!-- ================= ENTRENO ================= -->
  <section class="view" id="view-entreno">
    <div class="pillrow" id="workout-pills"></div>
    <div class="card" id="workout-card"></div>
  </section>

  <!-- ================= PESO ================= -->
  <section class="view" id="view-peso">
    <div class="card">
      <h2>Registrar peso <span class="tag">3x/semana o más</span></h2>
      <div class="weight-input-row">
        <input type="number" step="0.1" inputmode="decimal" id="weight-input" placeholder="Ej. 79.4">
        <button id="weight-save">Guardar</button>
      </div>
      <div class="chart-wrap"><canvas id="weight-chart"></canvas></div>
      <div class="trend-readout" id="weight-trend"></div>
    </div>
    <div class="card">
      <h2>Historial</h2>
      <div class="weight-history" id="weight-history"></div>
    </div>
  </section>

  <!-- ================= COMIDAS ================= -->
  <section class="view" id="view-comidas">
    <div class="pillrow" id="meal-mode-pills">
      <button class="pill active" data-mode="dia">Día</button>
      <button class="pill" data-mode="semana">Semana</button>
    </div>
    <div id="meal-day-pills-wrap">
      <div class="pillrow" id="meal-pills"></div>
    </div>
    <div class="card" id="meal-card"></div>
  </section>

  <!-- ================= COMPRA ================= -->
  <section class="view" id="view-compra">
    <div class="card">
      <h2>¿Qué días quieres comprar? <span class="tag">marca los que apliquen</span></h2>
      <div class="daycheck-grid" id="compra-daychecks"></div>
      <button class="ghost" id="compra-select-all" style="margin-top:10px;width:100%;">Marcar / desmarcar todos</button>
    </div>
    <div class="card" id="compra-list"></div>
  </section>

</main>

<nav class="tabbar">
  <button data-view="hoy" class="active">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
    <span>Hoy</span>
  </button>
  <button data-view="entreno">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="12" x2="18" y2="12"/><rect x="2" y="8" width="3" height="8" rx="1"/><rect x="19" y="8" width="3" height="8" rx="1"/><rect x="5" y="9.5" width="2" height="5"/><rect x="17" y="9.5" width="2" height="5"/></svg>
    <span>Entreno</span>
  </button>
  <button data-view="peso">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v4l3 2"/></svg>
    <span>Peso</span>
  </button>
  <button data-view="comidas">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2v7a2 2 0 0 0 4 0V2"/><path d="M9 9v13"/><path d="M16 2c-1.4 0-2 1.3-2 3v4c0 1 .9 2 2 2v9"/></svg>
    <span>Comidas</span>
  </button>
  <button data-view="compra">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M3 4h2l2.3 12a2 2 0 0 0 2 1.6h8.4a2 2 0 0 0 2-1.5L21 8H6.2"/></svg>
    <span>Compra</span>
  </button>
</nav>

<script>
// ---- Objetivos nutricionales diarios ----
const TARGETS = {
  kcal: 2180,
  protein: 175,
  fat: 70,
  carbs: 210,
};

const DAY_ORDER = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"];

const CAT_LABELS = {
  proteina: "Proteína",
  lacteo: "Lácteos",
  carbo: "Carbohidratos y legumbres",
  verdura: "Verduras y fruta",
  otros: "Grasas y otros",
};
const CAT_ORDER = ["proteina", "lacteo", "carbo", "verdura", "otros"];

// ---- Genera lista de la compra agregada a partir de una lista de días ----
function buildShoppingList(dayNames) {
  const totals = {};
  dayNames.forEach((day) => {
    const plan = MEALS[day];
    Object.values(plan).forEach((meal) => {
      (meal.ingredients || []).forEach((ing) => {
        const key = ing.name + "|" + ing.unit;
        if (!totals[key]) totals[key] = { name: ing.name, unit: ing.unit, qty: 0, cat: ing.cat };
        totals[key].qty += ing.qty;
      });
    });
  });
  const byCat = {};
  CAT_ORDER.forEach((c) => (byCat[c] = []));
  Object.values(totals).forEach((item) => {
    item.qty = Math.round(item.qty * 10) / 10;
    byCat[item.cat].push(item);
  });
  CAT_ORDER.forEach((c) => byCat[c].sort((a, b) => a.name.localeCompare(b.name, "es")));
  return byCat;
}

function renderMealCardHTML(dayName, isToday) {
  const plan = MEALS[dayName];
  let totalKcal = 0, totalProt = 0;
  const rows = Object.entries(plan).map(([mealName, m]) => {
    totalKcal += m.kcal;
    totalProt += m.protein;
    return `
      <div class="meal-row">
        <div class="meal-head">
          <span class="meal-name">${mealName}</span>
          <span class="meal-macro">${m.kcal} kcal · ${m.protein}g prot</span>
        </div>
        <div class="meal-text">${m.text}</div>
      </div>`;
  }).join("");

  const kcalClass = Math.abs(totalKcal - TARGETS.kcal) <= 150 ? "on-target" : "off-target";

  return `

      <div class="macro-box ${kcalClass}"><div class="val">${totalKcal}</div><div class="lbl">Kcal día</div></div>
      <div class="macro-box ${protClass}"><div class="val">${totalProt}g</div><div class="lbl">Proteína</div></div>
      <div class="macro-box"><div class="val">${TARGETS.kcal}</div><div class="lbl">Objetivo</div></div>
      <div class="macro-box"><div class="val">${TARGETS.protein}g</div><div class="lbl">Objetivo</div></div>

let currentWorkoutDay = "A";
let stopwatches = {}; // idx -> { running, start, interval }
let restTimers = {};  // idx -> intervalId
let audioCtx = null;

function getAudioContext() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === "suspended") {
    audioCtx.resume();
  }
  return audioCtx;
}

function getLastSession(dayKey, exerciseName, beforeDate) {
  const entries = Object.entries(store.workouts)
    .filter(([iso, w]) => w.day === dayKey && iso < beforeDate)
    .sort((a, b) => (a[0] < b[0] ? 1 : -1));
  for (const [iso, w] of entries) {
    const ex = w.exercises.find((e) => e.name === exerciseName);
    if (ex && ex.sets.length) {
      return { iso, set: ex.sets[0] };
    }
  }
  return null;
}

function playBeep() {
  try {
    const ctx = getAudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.55);
    osc.start();
    osc.stop(ctx.currentTime + 0.6);
    // Segundo pitido más agudo, para que se note aunque el primero se pierda
    setTimeout(() => {
      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      osc2.connect(gain2);
      gain2.connect(ctx.destination);
      osc2.frequency.value = 1046;
      gain2.gain.setValueAtTime(0.001, ctx.currentTime);
      gain2.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.02);
      gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
      osc2.start();
      osc2.stop(ctx.currentTime + 0.45);
    }, 250);
  } catch (e) { /* audio no disponible, seguimos sin sonido */ }
}

function startRestTimer(idx, seconds) {
  getAudioContext(); // desbloquear audio aquí, dentro del toque real del usuario
  const btn = document.querySelector(`[data-rest-start="${idx}"]`);
  const countdownEl = document.getElementById(`rest-countdown-${idx}`);
  if (!btn || !countdownEl) return;
  btn.style.display = "none";
  countdownEl.style.display = "flex";
  let remaining = seconds;

  const render = () => {
    const m = Math.floor(remaining / 60);
    const s = remaining % 60;
    countdownEl.innerHTML = `
      <span class="rc-time">${m}:${String(s).padStart(2, "0")}</span>
      <button class="rc-cancel" data-rest-cancel="${idx}">Cancelar</button>
    `;
    document.querySelector(`[data-rest-cancel="${idx}"]`).addEventListener("click", () => cancelRestTimer(idx));
  };
  render();

  restTimers[idx] = setInterval(() => {
    remaining--;
    if (remaining <= 0) {
      clearInterval(restTimers[idx]);
      countdownEl.innerHTML = `<span class="rc-done">¡Descanso terminado!</span>`;
      playBeep();
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      setTimeout(() => {
        if (countdownEl) countdownEl.style.display = "none";
        if (btn) btn.style.display = "block";
      }, 3000);
      return;
    }
    render();
  }, 1000);
}

function cancelRestTimer(idx) {
  clearInterval(restTimers[idx]);
  const countdownEl = document.getElementById(`rest-countdown-${idx}`);
  const btn = document.querySelector(`[data-rest-start="${idx}"]`);
  if (countdownEl) countdownEl.style.display = "none";
  if (btn) btn.style.display = "block";
}

function toggleStopwatch(idx) {
  const btn = document.querySelector(`[data-stopwatch="${idx}"]`);
  if (!btn) return;
  if (!stopwatches[idx] || !stopwatches[idx].running) {
    stopwatches[idx] = { running: true, start: Date.now(), interval: null };
    btn.innerHTML = `${ICON_STOP}<span class="sw-label">Detener (0s)</span>`;
    btn.classList.add("running");
    stopwatches[idx].interval = setInterval(() => {
      const elapsed = Math.floor((Date.now() - stopwatches[idx].start) / 1000);
      const lbl = btn.querySelector(".sw-label");
      if (lbl) lbl.textContent = `Detener (${elapsed}s)`;
    }, 250);
  } else {
    clearInterval(stopwatches[idx].interval);
    const elapsed = Math.floor((Date.now() - stopwatches[idx].start) / 1000);
    stopwatches[idx].running = false;
    btn.innerHTML = `${ICON_CLOCK}<span class="sw-label">Cronometrar</span>`;
    btn.classList.remove("running");
    const durInput = document.querySelector(`.exercise-row[data-ex="${idx}"] .in-duration`);
    if (durInput) durInput.value = elapsed;
  }
}

function adjustRest(dayKey, idx, delta) {
  const ex = store.workoutPlan[dayKey][idx];
  ex.rest = Math.min(300, Math.max(15, (ex.rest || 60) + delta));
  saveStore(store);
  const valEl = document.getElementById(`rest-value-${idx}`);
  const btnValEl = document.getElementById(`rest-btn-val-${idx}`);
  if (valEl) valEl.textContent = `${ex.rest}s`;
  if (btnValEl) btnValEl.textContent = ex.rest;
}

function renderWorkoutView(dayKey) {
  currentWorkoutDay = dayKey;
  document.getElementById("workout-pills").innerHTML = Object.keys(WORKOUTS).map(
    (k) => `<button class="pill ${k === dayKey ? "active" : ""}" data-day="${k}">${WORKOUTS[k].name}</button>`
  ).join("");

  const dayName = WORKOUTS[dayKey].name;
  const exList = store.workoutPlan[dayKey];
  const today = todayISO();
  const existing = store.workouts[today];
  const alreadyLoggedToday = existing && existing.day === dayKey;

  const rows = exList.map((ex, i) => {
    const isTime = ex.type === "time";
    const restVal = ex.rest || 60;
    const last = getLastSession(dayKey, ex.name, today);
    let lastText;
    if (!last) {
      lastText = "Sin registros previos — anota tu primera marca";
    } else if (isTime) {
      lastText = `Última vez (${fmtDate(last.iso)}): ${last.set.duration}seg x ${last.set.rounds} rondas`;
    } else {
      lastText = `Última vez (${fmtDate(last.iso)}): ${last.set.w}kg x ${last.set.r}`;
    }

    const savedSets = alreadyLoggedToday ? existing.exercises.find((e) => e.name === ex.name) : null;
    let w0 = "", r0 = "", d0 = "", rd0 = "";
    if (savedSets && savedSets.sets[0]) {
      if (isTime) { d0 = savedSets.sets[0].duration; rd0 = savedSets.sets[0].rounds; }
      else { w0 = savedSets.sets[0].w; r0 = savedSets.sets[0].r; }
    }

    const inputsHtml = isTime ? `
      <div class="set-inputs">
        <input type="number" inputmode="numeric" placeholder="Duración (seg)" class="in-duration" value="${d0}">
        <input type="number" inputmode="numeric" placeholder="Rondas" class="in-rounds" value="${rd0}">
      </div>
      <button class="ghost stopwatch-btn" data-stopwatch="${i}">${ICON_CLOCK}<span class="sw-label">Cronometrar</span></button>
    ` : `
      <div class="set-inputs">
        <input type="number" step="0.5" inputmode="decimal" placeholder="Peso (kg)" class="in-weight" value="${w0}">
        <input type="number" inputmode="numeric" placeholder="Reps" class="in-reps" value="${r0}">
      </div>
    `;

    return `
      <div class="exercise-row" data-ex="${i}">
        <button class="ex-remove" data-remove="${i}" aria-label="Quitar ejercicio">${ICON_X}</button>
        <div class="ex-name">${ex.name}</div>
        <div class="ex-scheme">${ex.scheme}</div>
        <div class="ex-last">${lastText}</div>
        <div class="ex-rest-row">
          <span class="ex-rest-label">Descanso</span>
          <div class="ex-rest-stepper">
            <button type="button" data-rest-minus="${i}" aria-label="Menos descanso">−</button>
            <span class="ex-rest-value" id="rest-value-${i}">${restVal}s</span>
            <button type="button" data-rest-plus="${i}" aria-label="Más descanso">+</button>
          </div>
        </div>
        ${inputsHtml}
        <div class="rest-timer">
          <button class="rest-start-btn" data-rest-start="${i}">${ICON_PLAY}Iniciar descanso (<span id="rest-btn-val-${i}">${restVal}</span>s)</button>
          <div class="rest-countdown" id="rest-countdown-${i}" style="display:none;"></div>
        </div>
      </div>`;
  }).join("");

  document.getElementById("workout-card").innerHTML = `
    <h2>${dayName} <span class="tag">${alreadyLoggedToday ? "guardado hoy" : todayISO()}</span></h2>
    ${rows || '<p class="empty-note">Sin ejercicios en este día — añade alguno abajo.</p>'}
    <button class="primary" id="save-workout">Guardar sesión de hoy</button>

    <div class="add-exercise">
      <div class="add-exercise-inputs">
        <input type="text" id="new-ex-name" placeholder="Nombre del ejercicio">
        <input type="text" id="new-ex-scheme" placeholder="Series x reps (ej. 3 x 10-12)">
        <select id="new-ex-type">
          <option value="reps">Reps y peso</option>
          <option value="time">Tiempo (ej. plancha)</option>
        </select>
        <input type="number" id="new-ex-rest" placeholder="Descanso (seg)" value="60">
      </div>
      <button class="ghost" id="add-exercise-btn" style="width:100%;">+ Añadir ejercicio</button>
    </div>
    <button class="ghost" id="reset-day-btn" style="width:100%;margin-top:8px;">Restaurar plantilla original de ${dayName}</button>
  `;

  document.querySelectorAll("#workout-pills .pill").forEach((p) => {
    p.addEventListener("click", () => renderWorkoutView(p.dataset.day));
  });

  document.querySelectorAll(".ex-remove").forEach((btn) => {
    btn.addEventListener("click", () => {
      const idx = parseInt(btn.dataset.remove, 10);
      store.workoutPlan[dayKey].splice(idx, 1);
      saveStore(store);
      renderWorkoutView(dayKey);
    });
  });

  document.querySelectorAll("[data-rest-minus]").forEach((btn) => {
    btn.addEventListener("click", () => adjustRest(dayKey, parseInt(btn.dataset.restMinus, 10), -15));
  });
  document.querySelectorAll("[data-rest-plus]").forEach((btn) => {
    btn.addEventListener("click", () => adjustRest(dayKey, parseInt(btn.dataset.restPlus, 10), 15));
  });

  document.querySelectorAll("[data-rest-start]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const idx = parseInt(btn.dataset.restStart, 10);
      startRestTimer(idx, exList[idx].rest || 60);
    });
  });

  document.querySelectorAll(".stopwatch-btn").forEach((btn) => {
    btn.addEventListener("click", () => toggleStopwatch(parseInt(btn.dataset.stopwatch, 10)));
  });

  document.getElementById("add-exercise-btn").addEventListener("click", () => {
    const nameInput = document.getElementById("new-ex-name");
    const schemeInput = document.getElementById("new-ex-scheme");
    const typeSel = document.getElementById("new-ex-type");
    const restInput = document.getElementById("new-ex-rest");
    const name = nameInput.value.trim();
    const scheme = schemeInput.value.trim() || "3 x 10-12";
    const type = typeSel.value;
    const rest = parseInt(restInput.value, 10) || 60;
    if (!name) { nameInput.focus(); return; }
    store.workoutPlan[dayKey].push({ name, scheme, type, rest });
    saveStore(store);
    renderWorkoutView(dayKey);
  });

  document.getElementById("reset-day-btn").addEventListener("click", () => {
    store.workoutPlan[dayKey] = WORKOUTS[dayKey].exercises.map((e) => ({ ...e }));
    saveStore(store);
    renderWorkoutView(dayKey);
  });

  document.getElementById("save-workout").addEventListener("click", () => {
    const exercises = [];
    document.querySelectorAll("#workout-card .exercise-row").forEach((row, i) => {
      const ex = exList[i];
      if (ex.type === "time") {
        const dVal = parseInt(row.querySelector(".in-duration").value, 10);
        const rdVal = parseInt(row.querySelector(".in-rounds").value, 10);
        exercises.push({
          name: ex.name,
          sets: (!isNaN(dVal) && !isNaN(rdVal)) ? [{ duration: dVal, rounds: rdVal }] : [],
        });
      } else {
        const wVal = parseFloat(row.querySelector(".in-weight").value);
        const rVal = parseInt(row.querySelector(".in-reps").value, 10);
        exercises.push({
          name: ex.name,
          sets: (!isNaN(wVal) && !isNaN(rVal)) ? [{ w: wVal, r: rVal }] : [],
        });
      }
    });
    store.workouts[todayISO()] = { day: dayKey, exercises };
    saveStore(store);
    renderWorkoutView(dayKey);
    renderHoy();
  });
}

function renderWeightView() {

  document.getElementById("weight-save").onclick = () => {

    if (isNaN(v) || v <= 0) return;
    store.weights.push({ date: todayISO(), w: v });
    store.weights.sort((a, b) => (a.date < b.date ? -1 : 1));
    saveStore(store);
    input.value = "";
    drawWeightChart();
    renderWeightHistory();
    renderHoy();

  drawWeightChart();
  renderWeightHistory();

function renderWeightHistory() {
  const el = document.getElementById("weight-history");
  if (!store.weights.length) {
    el.innerHTML = `<p class="empty-note">Aún no hay pesadas registradas.</p>`;
    return;
  }
  const rows = [...store.weights].reverse().slice(0, 20).map(
    (w) => `<div class="wh-row"><span>${fmtDate(w.date)}</span><span>${w.w} kg</span></div>`
  ).join("");
  el.innerHTML = rows;
}

function movingAverage(arr, windowSize) {
  return arr.map((_, i) => {
    const start = Math.max(0, i - windowSize + 1);
    const slice = arr.slice(start, i + 1);
    const avg = slice.reduce((s, p) => s + p.w, 0) / slice.length;
    return avg;
  });
}

function drawWeightChart() {
  const canvas = document.getElementById("weight-chart");
  const ctx = canvas.getContext("2d");
  const rect = canvas.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, rect.width, rect.height);

  const data = store.weights;
  const trendEl = document.getElementById("weight-trend");

  if (data.length < 2) {
    ctx.fillStyle = "#8891a8";
    ctx.font = "12px Inter, sans-serif";
    ctx.fillText("Registra al menos 2 pesadas para ver la tendencia", 10, rect.height / 2);
    trendEl.innerHTML = "";
    return;
  }

  const avg = movingAverage(data, 5);
  const pad = 16;
  const w = rect.width - pad * 2;
  const h = rect.height - pad * 2;

  const allVals = data.map((p) => p.w).concat(avg);
  const min = Math.min(...allVals) - 0.3;
  const max = Math.max(...allVals) + 0.3;
  const xStep = w / (data.length - 1);
  const yPos = (v) => pad + h - ((v - min) / (max - min)) * h;

  // raw points (dim)
  ctx.strokeStyle = "#2a324a";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  data.forEach((p, i) => {
    const x = pad + i * xStep;
    const y = yPos(p.w);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();

  // moving average (accent)
  ctx.strokeStyle = "#e8a33d";
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  avg.forEach((v, i) => {
    const x = pad + i * xStep;
    const y = yPos(v);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();

  // last point dot
  const lastX = pad + (data.length - 1) * xStep;
  const lastY = yPos(avg[avg.length - 1]);
  ctx.fillStyle = "#e8a33d";
  ctx.beginPath();
  ctx.arc(lastX, lastY, 3.5, 0, Math.PI * 2);
  ctx.fill();

  const first = avg[0];
  const last = avg[avg.length - 1];
  const delta = (last - first).toFixed(1);
  const sign = delta >= 0 ? "+" : "";
  trendEl.innerHTML = `
    <span>Media móvil (5 pesadas): <b>${last.toFixed(1)} kg</b></span>
    <span>Cambio en el periodo: <b>${sign}${delta} kg</b></span>
  `;
}

window.addEventListener("resize", () => {
  if (document.getElementById("view-peso").classList.contains("active")) drawWeightChart();
});
