<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#10141f">
<title>Cuaderno — plan 12 semanas</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root {
  --bg: #10141f;
  --surface: #1a2032;
  --surface-2: #212942;
  --border: #2a324a;
  --text: #e4e7ef;
  --text-muted: #8891a8;
  --accent: #e8a33d;
  --accent-dim: #6b5326;
  --good: #5fa777;
  --bad: #d9705d;
  --radius: 10px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  padding-bottom: 84px;
}

header.app-header {
  padding: 22px 20px 16px;
  border-bottom: 1px solid var(--border);
}

header.app-header .stamp {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent);
  border: 1px solid var(--accent-dim);
  padding: 3px 8px;
  border-radius: 999px;
  margin-bottom: 10px;
}

header.app-header h1 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 22px;
  font-weight: 700;
  margin: 0;
  letter-spacing: -0.01em;
}

header.app-header p {
  color: var(--text-muted);
  font-size: 13px;
  margin: 4px 0 0;
}

main { padding: 18px 20px 8px; }

section.view { display: none; }
section.view.active { display: block; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 14px;
}

.card h2 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 15px;
  font-weight: 600;
  margin: 0 0 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.card h2 .tag {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10.5px;
  color: var(--text-muted);
  font-weight: 500;
}

/* ---- Day selector pills ---- */
.pillrow {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 4px;
  margin-bottom: 14px;
  -ms-overflow-style: none;
  scrollbar-width: none;
}
.pillrow::-webkit-scrollbar { display: none; }

.pill {
  flex: 0 0 auto;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  padding: 7px 12px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-muted);
  cursor: pointer;
}
.pill.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #1a1206;
  font-weight: 600;
}

/* ---- Macro summary ---- */
.macro-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.macro-box {
  background: var(--surface-2);
  border-radius: 8px;
  padding: 10px 6px;
  text-align: center;
}
.macro-box .val {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 16px;
  font-weight: 600;
}
.macro-box .lbl {
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-top: 2px;
}
.macro-box.on-target .val { color: var(--good); }
.macro-box.off-target .val { color: var(--bad); }

/* ---- Meal rows ---- */
.meal-row {
  padding: 12px 0;
  border-top: 1px solid var(--border);
}
.meal-row:first-child { border-top: none; padding-top: 0; }
.meal-row .meal-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 4px;
}
.meal-row .meal-name {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 600;
  font-size: 13.5px;
  color: var(--accent);
}
.meal-row .meal-macro {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11.5px;
  color: var(--text-muted);
}
.meal-row .meal-text {
  font-size: 13.5px;
  line-height: 1.45;
  color: var(--text);
}

/* ---- Workout log ---- */
.exercise-row {
  border-top: 1px solid var(--border);
  padding: 12px 0;
  position: relative;
}
.exercise-row:first-child { border-top: none; padding-top: 0; }
.exercise-row .ex-remove {
  position: absolute;
  top: 12px;
  right: 0;
  background: none;
  border: 1px solid var(--border);
  color: var(--text-muted);
  width: 22px;
  height: 22px;
  border-radius: 50%;
  font-size: 14px;
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.exercise-row:first-child .ex-remove { top: 0; }
.exercise-row .ex-remove:active { color: var(--bad); border-color: var(--bad); }
.exercise-row .ex-name {
  font-weight: 600;
  font-size: 13.5px;
  padding-right: 30px;
}
.exercise-row .ex-scheme {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 8px;
}
.exercise-row .ex-last {
  font-size: 11.5px;
  color: var(--accent);
  margin-bottom: 8px;
  font-family: 'IBM Plex Mono', monospace;
}
.set-inputs {
  display: flex;
  gap: 8px;
}
.set-inputs input {
  flex: 1;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  padding: 8px;
  width: 100%;
}
.set-inputs input::placeholder { color: #4d566e; }

button.primary {
  width: 100%;
  background: var(--accent);
  color: #1a1206;
  border: none;
  border-radius: 8px;
  padding: 13px;
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  margin-top: 4px;
}
button.primary:active { opacity: 0.85; }

button.ghost {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-muted);
  border-radius: 8px;
  padding: 8px 12px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  cursor: pointer;
}

.add-exercise {
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px dashed var(--border);
}
.add-exercise-inputs {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 8px;
}
.add-exercise-inputs input {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  padding: 9px 10px;
  width: 100%;
}
.add-exercise-inputs input::placeholder { color: #4d566e; }

/* ---- Weight log ---- */
.weight-input-row {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}
.weight-input-row input {
  flex: 1;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 15px;
  padding: 10px 12px;
}
.weight-input-row button {
  background: var(--accent);
  color: #1a1206;
  border: none;
  border-radius: 8px;
  padding: 0 18px;
  font-weight: 700;
  cursor: pointer;
}

.chart-wrap { position: relative; height: 150px; margin-bottom: 8px; }
.chart-wrap canvas { width: 100%; height: 100%; }

.trend-readout {
  display: flex;
  justify-content: space-between;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  color: var(--text-muted);
  padding-top: 8px;
  border-top: 1px solid var(--border);
}
.trend-readout b { color: var(--text); }

.weight-history {
  margin-top: 10px;
  max-height: 140px;
  overflow-y: auto;
}
.weight-history .wh-row {
  display: flex;
  justify-content: space-between;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  padding: 6px 0;
  border-top: 1px solid var(--border);
  color: var(--text-muted);
}
.weight-history .wh-row span:last-child { color: var(--text); }

/* ---- Vista semana (Comidas) ---- */
.week-day-block {
  border-top: 1px solid var(--border);
  padding: 12px 0;
}
.week-day-block:first-child { border-top: none; padding-top: 0; }
.week-day-block .wd-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 6px;
}
.week-day-block .wd-name {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 14px;
}
.week-day-block .wd-macro {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--text-muted);
}
.week-day-block .wd-meals {
  font-size: 12.5px;
  color: var(--text-muted);
  line-height: 1.6;
}
.week-day-block .wd-meals b { color: var(--text); font-weight: 500; }

/* ---- Lista de la compra ---- */
.daycheck-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.daycheck {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 10px 4px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  cursor: pointer;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--text-muted);
}
.daycheck.checked {
  border-color: var(--accent);
  color: var(--accent);
}
.daycheck input { display: none; }
.daycheck .box {
  width: 16px;
  height: 16px;
  border-radius: 4px;
  border: 1.5px solid var(--border);
}
.daycheck.checked .box {
  background: var(--accent);
  border-color: var(--accent);
}

.shop-cat { margin-bottom: 16px; }
.shop-cat:last-child { margin-bottom: 0; }
.shop-cat h3 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--accent);
  margin: 0 0 8px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
.shop-item {
  display: flex;
  justify-content: space-between;
  font-size: 13.5px;
  padding: 7px 0;
  border-top: 1px solid var(--border);
}
.shop-item:first-child { border-top: none; }
.shop-item .qty {
  font-family: 'IBM Plex Mono', monospace;
  color: var(--text-muted);
  white-space: nowrap;
  margin-left: 12px;
}

.tomorrow-list {
  font-size: 13px;
  color: var(--text-muted);
  line-height: 1.7;
}
.tomorrow-list b { color: var(--text); font-weight: 500; }

.empty-note {
  font-size: 12.5px;
  color: var(--text-muted);
  text-align: center;
  padding: 12px 0;
}

/* ---- Bottom nav ---- */
nav.tabbar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
}
nav.tabbar button {
  flex: 1;
  background: none;
  border: none;
  color: var(--text-muted);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10.5px;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  padding: 12px 4px 10px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
nav.tabbar button .dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: transparent;
}
nav.tabbar button.active { color: var(--accent); }
nav.tabbar button.active .dot { background: var(--accent); }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

</style>
<style>
  .demo-banner {
    background: #2a2110;
    border-bottom: 1px solid #6b5326;
    color: #e8a33d;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    text-align: center;
    padding: 7px 10px;
    letter-spacing: 0.03em;
  }
</style>
</head>
<body>
<div class="demo-banner">VISTA PREVIA · datos simulados, no se guardan</div>

<header class="app-header">
  <div class="stamp">Ciclo · 12 semanas</div>
  <h1>Cuaderno de entrenamiento</h1>
  <p>Mié / Vie / Sáb entreno · resto descanso + dieta</p>
</header>

<main>

  <!-- ================= HOY ================= -->
  <section class="view active" id="view-hoy">
    <div class="card" id="hoy-resumen"></div>
    <div class="card" id="hoy-comidas"></div>
    <div class="card" id="hoy-manana"></div>
  </section>

  <!-- ================= ENTRENO ================= -->
  <section class="view" id="view-entreno">
    <div class="pillrow" id="workout-pills"></div>
    <div class="card" id="workout-card"></div>
  </section>

  <!-- ================= PESO ================= -->
  <section class="view" id="view-peso">
    <div class="card">
      <h2>Registrar peso <span class="tag">3x/semana o más</span></h2>
      <div class="weight-input-row">
        <input type="number" step="0.1" inputmode="decimal" id="weight-input" placeholder="Ej. 79.4">
        <button id="weight-save">Guardar</button>
      </div>
      <div class="chart-wrap"><canvas id="weight-chart"></canvas></div>
      <div class="trend-readout" id="weight-trend"></div>
    </div>
    <div class="card">
      <h2>Historial</h2>
      <div class="weight-history" id="weight-history"></div>
    </div>
  </section>

  <!-- ================= COMIDAS ================= -->
  <section class="view" id="view-comidas">
    <div class="pillrow" id="meal-mode-pills">
      <button class="pill active" data-mode="dia">Día</button>
      <button class="pill" data-mode="semana">Semana</button>
    </div>
    <div id="meal-day-pills-wrap">
      <div class="pillrow" id="meal-pills"></div>
    </div>
    <div class="card" id="meal-card"></div>
  </section>

  <!-- ================= COMPRA ================= -->
  <section class="view" id="view-compra">
    <div class="card">
      <h2>¿Qué días quieres comprar? <span class="tag">marca los que apliquen</span></h2>
      <div class="daycheck-grid" id="compra-daychecks"></div>
      <button class="ghost" id="compra-select-all" style="margin-top:10px;width:100%;">Marcar / desmarcar todos</button>
    </div>
    <div class="card" id="compra-list"></div>
  </section>

</main>

<nav class="tabbar">
  <button data-view="hoy" class="active"><span class="dot"></span>Hoy</button>
  <button data-view="entreno"><span class="dot"></span>Entreno</button>
  <button data-view="peso"><span class="dot"></span>Peso</button>
  <button data-view="comidas"><span class="dot"></span>Comidas</button>
  <button data-view="compra"><span class="dot"></span>Compra</button>
</nav>

};
const CAT_ORDER = ["proteina", "lacteo", "carbo", "verdura", "otros"];

// ---- Genera lista de la compra agregada a partir de una lista de días ----
function buildShoppingList(dayNames) {
  const totals = {};
  dayNames.forEach((day) => {
    const plan = MEALS[day];
    Object.values(plan).forEach((meal) => {
      (meal.ingredients || []).forEach((ing) => {
        const key = ing.name + "|" + ing.unit;
        if (!totals[key]) totals[key] = { name: ing.name, unit: ing.unit, qty: 0, cat: ing.cat };
        totals[key].qty += ing.qty;
      });
    });
  });
  const byCat = {};
  CAT_ORDER.forEach((c) => (byCat[c] = []));
  Object.values(totals).forEach((item) => {
    item.qty = Math.round(item.qty * 10) / 10;
    byCat[item.cat].push(item);
  });
  CAT_ORDER.forEach((c) => byCat[c].sort((a, b) => a.name.localeCompare(b.name, "es")));
  return byCat;
}

          <span class="meal-macro">${m.kcal} kcal · ${m.protein}g prot</span>

        <div class="meal-text">${m.text}</div>

  ).join("");
  document.getElementById("meal-card").innerHTML = renderMealCardHTML(mealSelectedDay, false);

  document.querySelectorAll("#meal-pills .pill").forEach((p) => {
    p.addEventListener("click", () => {
      mealSelectedDay = p.dataset.day;
      renderMealsView();
    });
  });
}

document.querySelectorAll("#meal-mode-pills .pill").forEach((p) => {
  p.addEventListener("click", () => {
    mealMode = p.dataset.mode;
    renderMealsView();
  });
});

// ================= Vista: COMPRA =================
let compraChecked = new Set(DAY_ORDER);

function renderCompraView() {
  const wrap = document.getElementById("compra-daychecks");
  wrap.innerHTML = DAY_ORDER.map((d) => `
    <label class="daycheck ${compraChecked.has(d) ? "checked" : ""}" data-day="${d}">
      <span class="box"></span>${d.slice(0, 3)}
    </label>
  `).join("");

  wrap.querySelectorAll(".daycheck").forEach((el) => {
    el.addEventListener("click", () => {
      const d = el.dataset.day;
      compraChecked.has(d) ? compraChecked.delete(d) : compraChecked.add(d);
      renderCompraView();
    });
  });

  document.getElementById("compra-select-all").onclick = () => {
    compraChecked = compraChecked.size === DAY_ORDER.length ? new Set() : new Set(DAY_ORDER);
    renderCompraView();
  };

  const byCat = buildShoppingList([...compraChecked]);
  const hasItems = CAT_ORDER.some((c) => byCat[c].length);

  if (!hasItems) {
    document.getElementById("compra-list").innerHTML = `<p class="empty-note">Marca al menos un día para generar la lista.</p>`;
    return;
  }

  const sections = CAT_ORDER.filter((c) => byCat[c].length).map((c) => `
    <div class="shop-cat">
      <h3>${CAT_LABELS[c]}</h3>
      ${byCat[c].map((item) => `
        <div class="shop-item">
          <span>${item.name}</span>
          <span class="qty">${item.qty} ${item.unit}${item.qty !== 1 ? (item.unit === "unidad" ? "es" : "") : ""}</span>
        </div>
      `).join("")}
    </div>
  `).join("");

  document.getElementById("compra-list").innerHTML = `
    <h2>Lista de la compra <span class="tag">${compraChecked.size} días</span></h2>
    ${sections}
    <p class="empty-note" style="text-align:left;padding-top:6px;">Los platos "libres" (sábado) no suman ingredientes fijos — decide sobre la marcha.</p>
  `;
}

// ================= Vista: ENTRENO =================
let currentWorkoutDay = "A";

function getLastSession(dayKey, exerciseName, beforeDate) {
  const entries = Object.entries(store.workouts)
    .filter(([iso, w]) => w.day === dayKey && iso < beforeDate)
    .sort((a, b) => (a[0] < b[0] ? 1 : -1));
  for (const [iso, w] of entries) {
    const ex = w.exercises.find((e) => e.name === exerciseName);
    if (ex && ex.sets.length) {
      const best = ex.sets.reduce((a, b) => (b.w > a.w ? b : a), ex.sets[0]);
      return { iso, best };
    }
  }
  return null;
}

function renderWorkoutView(dayKey) {
  currentWorkoutDay = dayKey;
  document.getElementById("workout-pills").innerHTML = Object.keys(WORKOUTS).map(
    (k) => `<button class="pill ${k === dayKey ? "active" : ""}" data-day="${k}">${WORKOUTS[k].name}</button>`
  ).join("");

  const dayName = WORKOUTS[dayKey].name;
  const exList = store.workoutPlan[dayKey]; // editable: nombre + esquema
  const today = todayISO();
  const existing = store.workouts[today];
  const alreadyLoggedToday = existing && existing.day === dayKey;

  const rows = exList.map((ex, i) => {
    const last = getLastSession(dayKey, ex.name, today);
    const lastText = last
      ? `Última vez (${fmtDate(last.iso)}): ${last.best.w}kg x ${last.best.r}`
      : "Sin registros previos — anota tu primera marca";
    const savedSets = alreadyLoggedToday
      ? existing.exercises.find((e) => e.name === ex.name)
      : null;
    const w0 = savedSets && savedSets.sets[0] ? savedSets.sets[0].w : "";
    const r0 = savedSets && savedSets.sets[0] ? savedSets.sets[0].r : "";

    return `
      <div class="exercise-row" data-ex="${i}">
        <button class="ex-remove" data-remove="${i}" aria-label="Quitar ejercicio">×</button>
        <div class="ex-name">${ex.name}</div>
        <div class="ex-scheme">${ex.scheme}</div>
        <div class="ex-last">${lastText}</div>
        <div class="set-inputs">
          <input type="number" step="0.5" inputmode="decimal" placeholder="Peso (kg)" class="in-weight" value="${w0}">
          <input type="number" inputmode="numeric" placeholder="Reps" class="in-reps" value="${r0}">
        </div>
      </div>`;
  }).join("");

  document.getElementById("workout-card").innerHTML = `
    <h2>${dayName} <span class="tag">${alreadyLoggedToday ? "guardado hoy" : todayISO()}</span></h2>
    ${rows || '<p class="empty-note">Sin ejercicios en este día — añade alguno abajo.</p>'}
    <button class="primary" id="save-workout">Guardar sesión de hoy</button>

    <div class="add-exercise">
      <div class="add-exercise-inputs">
        <input type="text" id="new-ex-name" placeholder="Nombre del ejercicio">
        <input type="text" id="new-ex-scheme" placeholder="Series x reps (ej. 3 x 10-12)">
      </div>
      <button class="ghost" id="add-exercise-btn" style="width:100%;">+ Añadir ejercicio</button>
    </div>
    <button class="ghost" id="reset-day-btn" style="width:100%;margin-top:8px;">Restaurar plantilla original de ${dayName}</button>
  `;

  document.querySelectorAll("#workout-pills .pill").forEach((p) => {
    p.addEventListener("click", () => renderWorkoutView(p.dataset.day));
  });

  document.querySelectorAll(".ex-remove").forEach((btn) => {
    btn.addEventListener("click", () => {
      const idx = parseInt(btn.dataset.remove, 10);
      store.workoutPlan[dayKey].splice(idx, 1);
      saveStore(store);
      renderWorkoutView(dayKey);
    });
  });

  document.getElementById("add-exercise-btn").addEventListener("click", () => {
    const nameInput = document.getElementById("new-ex-name");
    const schemeInput = document.getElementById("new-ex-scheme");
    const name = nameInput.value.trim();
    const scheme = schemeInput.value.trim() || "3 x 10-12";
    if (!name) { nameInput.focus(); return; }
    store.workoutPlan[dayKey].push({ name, scheme });
    saveStore(store);
    renderWorkoutView(dayKey);
  });

  document.getElementById("reset-day-btn").addEventListener("click", () => {
    store.workoutPlan[dayKey] = WORKOUTS[dayKey].exercises.map((e) => ({ ...e }));
    saveStore(store);
    renderWorkoutView(dayKey);
  });

  document.getElementById("save-workout").addEventListener("click", () => {
    const exercises = [];
    document.querySelectorAll("#workout-card .exercise-row").forEach((row, i) => {
      const wVal = parseFloat(row.querySelector(".in-weight").value);
      const rVal = parseInt(row.querySelector(".in-reps").value, 10);
      exercises.push({
        name: exList[i].name,
        sets: (!isNaN(wVal) && !isNaN(rVal)) ? [{ w: wVal, r: rVal }] : [],
      });
    });
    store.workouts[todayISO()] = { day: dayKey, exercises };
    saveStore(store);
    renderWorkoutView(dayKey);
    renderHoy();
  });
}

// ================= Vista: PESO =================
function renderWeightView() {
  const input = document.getElementById("weight-input");
  document.getElementById("weight-save").onclick = () => {
    const v = parseFloat(input.value);
    if (isNaN(v) || v <= 0) return;
    store.weights.push({ date: todayISO(), w: v });
    store.weights.sort((a, b) => (a.date < b.date ? -1 : 1));
    saveStore(store);
    input.value = "";
    drawWeightChart();
    renderWeightHistory();
    renderHoy();
  };
  drawWeightChart();
  renderWeightHistory();
}

function renderWeightHistory() {
  const el = document.getElementById("weight-history");
  if (!store.weights.length) {
    el.innerHTML = `<p class="empty-note">Aún no hay pesadas registradas.</p>`;
    return;
  }
  const rows = [...store.weights].reverse().slice(0, 20).map(
    (w) => `<div class="wh-row"><span>${fmtDate(w.date)}</span><span>${w.w} kg</span></div>`
  ).join("");
  el.innerHTML = rows;
}

function movingAverage(arr, windowSize) {
  return arr.map((_, i) => {
    const start = Math.max(0, i - windowSize + 1);
    const slice = arr.slice(start, i + 1);
    const avg = slice.reduce((s, p) => s + p.w, 0) / slice.length;
    return avg;
  });
}

function drawWeightChart() {
  const canvas = document.getElementById("weight-chart");
  const ctx = canvas.getContext("2d");
  const rect = canvas.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, rect.width, rect.height);

  const data = store.weights;
  const trendEl = document.getElementById("weight-trend");

  if (data.length < 2) {
    ctx.fillStyle = "#8891a8";
    ctx.font = "12px Inter, sans-serif";
    ctx.fillText("Registra al menos 2 pesadas para ver la tendencia", 10, rect.height / 2);
    trendEl.innerHTML = "";
    return;
  }

  const avg = movingAverage(data, 5);
  const pad = 16;
  const w = rect.width - pad * 2;
  const h = rect.height - pad * 2;

  const allVals = data.map((p) => p.w).concat(avg);
  const min = Math.min(...allVals) - 0.3;
  const max = Math.max(...allVals) + 0.3;
  const xStep = w / (data.length - 1);
  const yPos = (v) => pad + h - ((v - min) / (max - min)) * h;

  // raw points (dim)
  ctx.strokeStyle = "#2a324a";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  data.forEach((p, i) => {
    const x = pad + i * xStep;
    const y = yPos(p.w);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();

  // moving average (accent)
  ctx.strokeStyle = "#e8a33d";
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  avg.forEach((v, i) => {
    const x = pad + i * xStep;
    const y = yPos(v);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();

  // last point dot
  const lastX = pad + (data.length - 1) * xStep;
  const lastY = yPos(avg[avg.length - 1]);
  ctx.fillStyle = "#e8a33d";
  ctx.beginPath();
  ctx.arc(lastX, lastY, 3.5, 0, Math.PI * 2);
  ctx.fill();

  const first = avg[0];
  const last = avg[avg.length - 1];
  const delta = (last - first).toFixed(1);
  const sign = delta >= 0 ? "+" : "";
  trendEl.innerHTML = `
    <span>Media móvil (5 pesadas): <b>${last.toFixed(1)} kg</b></span>
    <span>Cambio en el periodo: <b>${sign}${delta} kg</b></span>
  `;
}

window.addEventListener("resize", () => {
  if (document.getElementById("view-peso").classList.contains("active")) drawWeightChart();
});
