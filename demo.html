<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10141f">
<title>Cuaderno — plan 12 semanas</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap');

:root {
  --bg: #0a0a0a;
  --surface: #131313;
  --surface-2: #1c1c1c;
  --border: rgba(255, 255, 255, 0.10);
  --text: #f5f5f5;
  --text-muted: #8a8a8a;
  --accent: #ccff00;
  --accent-dim: rgba(204, 255, 0, 0.25);
  --accent-glow: rgba(204, 255, 0, 0.18);
  --secondary: #334155;
  --protein: #ccff00;
  --tertiary: #ff3e00;
  --good: #ccff00;
  --bad: #ff3e00;
  --radius: 10px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Sora', system-ui, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  padding-bottom: calc(94px + env(safe-area-inset-bottom, 0px));
}

header.app-header {
  padding: 22px 20px 16px;
  border-bottom: 1px solid var(--border);
}

header.app-header .stamp {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent);
  border: 1px solid var(--accent-dim);
  padding: 3px 8px;
  border-radius: 8px;
  margin-bottom: 10px;
}

header.app-header h1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 30px;
  font-weight: 400;
  letter-spacing: 0.02em;
  margin: 0;
  line-height: 1;
}

header.app-header p {
  color: var(--text-muted);
  font-size: 13px;
  margin: 6px 0 0;
}

main { padding: 18px 20px 8px; }

section.view { display: none; }
section.view.active { display: block; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 14px;
}

.card h2 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 20px;
  font-weight: 400;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  margin: 0 0 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.card h2 .tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  color: var(--text-muted);
  font-weight: 500;
}

/* ---- Day selector pills ---- */
.pillrow {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 4px;
  margin-bottom: 14px;
  -ms-overflow-style: none;
  scrollbar-width: none;
}
.pillrow::-webkit-scrollbar { display: none; }

.pill {
  flex: 0 0 auto;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  padding: 7px 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-muted);
  cursor: pointer;
}
.pill.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #1a1206;
  font-weight: 600;
}

/* ---- Macro summary ---- */
.macro-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.macro-box {
  background: var(--surface-2);
  border-radius: 10px;
  padding: 10px 6px;
  text-align: center;
}
.macro-box .val {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  font-weight: 400;
  letter-spacing: 0.01em;
}
.macro-box .lbl {
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-top: 2px;
}
.macro-box.kcal-box .val,
.macro-box.protein-box .val { color: var(--protein); }

/* ---- Meal rows ---- */
.meal-row {
  padding: 12px 0;
  border-top: 1px solid var(--border);
}
.meal-row:first-child { border-top: none; padding-top: 0; }
.meal-row .meal-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 4px;
}
.meal-row .meal-name {
  font-family: 'Bebas Neue', sans-serif;
  font-weight: 600;
  font-size: 13.5px;
  color: var(--accent);
}
.meal-row .meal-macro {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px;
  color: var(--text-muted);
}
.meal-row .meal-text {
  font-size: 13.5px;
  line-height: 1.45;
  color: var(--text);
}

/* ---- Workout log ---- */
.exercise-row {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 18px 16px;
  margin-bottom: 14px;
  position: relative;
  transition: background-color 300ms ease, border-color 300ms ease;
}
.exercise-row:last-child { margin-bottom: 0; }
.exercise-row.completed {
  background: rgba(34, 197, 94, 0.08);
  border-color: rgba(34, 197, 94, 0.4);
}
.exercise-row .ex-remove {
  position: absolute;
  top: 14px;
  right: 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-muted);
  width: 32px;
  height: 32px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.exercise-row .ex-remove:active { color: var(--bad); border-color: var(--bad); }
.exercise-row .ex-name {
  font-weight: 700;
  font-size: 16px;
  padding-right: 40px;
  margin-bottom: 6px;
  line-height: 1.3;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.ex-done-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: rgba(34, 197, 94, 0.16);
  color: var(--good);
  border: 1px solid rgba(34, 197, 94, 0.4);
  border-radius: 8px;
  padding: 3px 10px 3px 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 600;
}
.ex-done-badge .icon { width: 12px; height: 12px; }
.exercise-row .ex-scheme {
  display: block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12.5px;
  color: var(--text-muted);
  margin-bottom: 10px;
}
.exercise-row .ex-last {
  font-size: 12.5px;
  color: var(--accent);
  margin-bottom: 12px;
  font-family: 'JetBrains Mono', monospace;
}
.ex-rest-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px 8px 8px 14px;
  margin-bottom: 14px;
}
.ex-rest-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12.5px;
  color: var(--text-muted);
}
.ex-rest-stepper {
  display: flex;
  align-items: center;
  gap: 10px;
}
.ex-rest-stepper button {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 19px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.ex-rest-stepper button:active { background: var(--accent-dim); }
.ex-rest-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14.5px;
  font-weight: 600;
  min-width: 42px;
  text-align: center;
}

/* ---- Lista de series individuales ---- */
.sets-list { display: flex; flex-direction: column; gap: 8px; }
.set-row {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px 10px;
  min-height: 52px;
}
.set-row.done {
  background: rgba(34, 197, 94, 0.07);
  border-color: rgba(34, 197, 94, 0.3);
}
.set-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--text-muted);
  width: 24px;
  flex-shrink: 0;
}
.set-hint {
  flex: 1;
  font-size: 13px;
  color: var(--text-muted);
}
.set-result {
  flex: 1;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 21px;
  font-weight: 400;
  letter-spacing: 0.01em;
  color: var(--text);
}
.set-check-badge {
  color: var(--good);
  width: 22px;
  height: 22px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.set-row input {
  flex: 1;
  min-width: 0;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 15px;
  padding: 10px 8px;
  min-height: 40px;
  text-align: center;
}
.set-row input::placeholder { color: #4d566e; font-size: 12px; }
.set-start-btn, .set-done-btn {
  flex-shrink: 0;
  width: 44px;
  height: 40px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.set-start-btn {
  background: var(--accent);
  color: #1a1206;
}
.set-start-btn .icon { width: 15px; height: 15px; }
.set-done-btn {
  background: var(--surface-2);
  border: 1.5px solid var(--good);
  color: var(--good);
  width: auto;
  padding: 0 10px;
  gap: 6px;
}
.set-done-btn .set-elapsed {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12.5px;
}
.set-done-btn .icon { width: 15px; height: 15px; }

.add-exercise-row2 {
  display: flex;
  gap: 10px;
}
.add-exercise-row2 input { flex: 1; }

/* ---- Barra fija de descanso ---- */
.global-rest-bar {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(58px + env(safe-area-inset-bottom, 0px));
  width: 100%;
  max-width: 480px;
  z-index: 40;
  padding: 0 14px;
}
.grb-inner {
  background: var(--surface);
  border: 1px solid var(--accent);
  border-radius: 8px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4), 0 0 0 1px var(--accent-glow);
}
.grb-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px;
  color: var(--text-muted);
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.grb-time {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 32px;
  font-weight: 400;
  letter-spacing: 0.02em;
  color: var(--accent);
}
.grb-plus30 {
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 8px;
  padding: 8px 10px;
  min-height: 36px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px;
  font-weight: 600;
  cursor: pointer;
}
.grb-cancel {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-muted);
  border-radius: 8px;
  padding: 8px 12px;
  min-height: 36px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px;
  cursor: pointer;
}


button.primary {
  width: 100%;
  background: var(--accent);
  color: #121212;
  border: none;
  border-radius: 8px;
  padding: 15px;
  min-height: 50px;
  font-family: 'Bebas Neue', sans-serif;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 0.01em;
  cursor: pointer;
  margin-top: 4px;
  box-shadow: 0 4px 16px var(--accent-glow);
}
button.primary:active { opacity: 0.9; }

button.ghost {
  background: transparent;
  border: 1.5px solid var(--border);
  color: var(--text-muted);
  border-radius: 8px;
  padding: 12px 16px;
  min-height: 46px;
  font-family: 'Sora', sans-serif;
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
}

.add-exercise {
  margin-top: 18px;
  padding-top: 16px;
  border-top: 1px dashed var(--border);
}
.add-exercise-inputs {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 10px;
}
.add-exercise-inputs input {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-family: 'Sora', sans-serif;
  font-size: 15px;
  padding: 12px 12px;
  min-height: 46px;
  width: 100%;
}
.add-exercise-inputs input::placeholder { color: #4d566e; }
.add-exercise-inputs select {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-family: 'Sora', sans-serif;
  font-size: 15px;
  padding: 12px 12px;
  min-height: 46px;
  width: 100%;
}

/* ---- Weight log ---- */
.weight-input-row {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}
.weight-input-row input {
  flex: 1;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 15px;
  padding: 10px 12px;
}
.weight-input-row button {
  background: var(--accent);
  color: #1a1206;
  border: none;
  border-radius: 10px;
  padding: 0 18px;
  font-weight: 700;
  cursor: pointer;
}

.chart-wrap { position: relative; height: 150px; margin-bottom: 8px; }
.chart-wrap canvas { width: 100%; height: 100%; }

.trend-readout {
  display: flex;
  justify-content: space-between;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--text-muted);
  padding-top: 8px;
  border-top: 1px solid var(--border);
}
.trend-readout b { color: var(--text); }

.weight-history {
  margin-top: 10px;
  max-height: 140px;
  overflow-y: auto;
}
.weight-history .wh-row {
  display: flex;
  justify-content: space-between;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  padding: 6px 0;
  border-top: 1px solid var(--border);
  color: var(--text-muted);
}
.weight-history .wh-row span:last-child { color: var(--text); }

/* ---- Vista semana (Comidas) ---- */
.week-day-block {
  border-top: 1px solid var(--border);
  padding: 12px 0;
}
.week-day-block:first-child { border-top: none; padding-top: 0; }
.week-day-block .wd-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 6px;
}
.week-day-block .wd-name {
  font-family: 'Bebas Neue', sans-serif;
  font-weight: 700;
  font-size: 14px;
}
.week-day-block .wd-macro {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-muted);
}
.week-day-block .wd-meals {
  font-size: 12.5px;
  color: var(--text-muted);
  line-height: 1.6;
}
.week-day-block .wd-meals b { color: var(--text); font-weight: 500; }

/* ---- Lista de la compra ---- */
.daycheck-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}
.daycheck {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 14px 4px;
  border-radius: 8px;
  border: 1.5px solid var(--border);
  background: var(--surface-2);
  cursor: pointer;
  font-family: 'Sora', sans-serif;
  font-weight: 600;
  font-size: 12px;
  color: var(--text-muted);
}
.daycheck.checked {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-dim);
}
.daycheck input { display: none; }
.daycheck .box {
  width: 18px;
  height: 18px;
  border-radius: 5px;
  border: 1.5px solid var(--border);
  background: var(--surface);
}
.daycheck.checked .box {
  background: var(--accent);
  border-color: var(--accent);
}

.shop-cat { margin-bottom: 16px; }
.shop-cat:last-child { margin-bottom: 0; }
.shop-cat h3 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--accent);
  margin: 0 0 8px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
.shop-item {
  display: flex;
  justify-content: space-between;
  font-size: 13.5px;
  padding: 7px 0;
  border-top: 1px solid var(--border);
}
.shop-item:first-child { border-top: none; }
.shop-item .qty {
  font-family: 'JetBrains Mono', monospace;
  color: var(--text-muted);
  white-space: nowrap;
  margin-left: 12px;
}

.tomorrow-list {
  font-size: 13px;
  color: var(--text-muted);
  line-height: 1.7;
}
.tomorrow-list b { color: var(--text); font-weight: 500; }

.empty-note {
  font-size: 12.5px;
  color: var(--text-muted);
  text-align: center;
  padding: 12px 0;
}
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 28px 0 20px;
}
.empty-state-icon {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  margin-bottom: 12px;
}
.empty-state-icon svg { width: 22px; height: 22px; }
.empty-state .empty-note { padding: 0; }

/* ---- Bottom nav ---- */
nav.tabbar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
nav.tabbar button {
  flex: 1;
  background: none;
  border: none;
  color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  padding: 14px 4px 14px;
  min-height: 58px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  -webkit-tap-highlight-color: transparent;
}
nav.tabbar button .tab-icon {
  width: 21px;
  height: 21px;
  flex-shrink: 0;
}
nav.tabbar button.active { color: var(--accent); }
nav.tabbar button.active .tab-icon { filter: drop-shadow(0 0 6px var(--accent-glow)); }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* Feedback táctil: todo elemento tocable reacciona al tap, nunca un cambio instantáneo sin aviso */
button, .pill, .daycheck {
  transition: transform 100ms ease, opacity 100ms ease, background-color 150ms ease, border-color 150ms ease;
}
button:active, .pill:active, .daycheck:active {
  transform: scale(0.96);
}

.icon {
  width: 17px;
  height: 17px;
  flex-shrink: 0;
  vertical-align: -3px;
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

</style>
<style>
  .demo-banner {
    background: #1a1f00;
    border-bottom: 1px solid rgba(204,255,0,0.35);
    color: #ccff00;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    text-align: center;
    padding: 7px 10px;
    letter-spacing: 0.03em;
  }
</style>
</head>
<body>
<div class="demo-banner">VISTA PREVIA · datos simulados, no se guardan</div>

<header class="app-header">
  <div class="stamp">Ciclo · 12 semanas</div>
  <h1>Cuaderno de entrenamiento</h1>
  <p>Mié / Vie / Sáb entreno · resto descanso + dieta</p>
</header>

<main>

  <!-- ================= HOY ================= -->
  <section class="view active" id="view-hoy">
    <div class="card" id="hoy-resumen"></div>
    <div class="card" id="hoy-comidas"></div>
    <div class="card" id="hoy-manana"></div>
  </section>

  <!-- ================= ENTRENO ================= -->
  <section class="view" id="view-entreno">
    <div class="pillrow" id="workout-pills"></div>
    <div class="card" id="workout-card"></div>
  </section>

  <!-- ================= PESO ================= -->
  <section class="view" id="view-peso">
    <div class="card">
      <h2>Registrar peso <span class="tag">3x/semana o más</span></h2>
      <div class="weight-input-row">

  proteina: "Proteína",
  lacteo: "Lácteos",
  carbo: "Carbohidratos y legumbres",
  verdura: "Verduras y fruta",
  otros: "Grasas y otros",
};
const CAT_ORDER = ["proteina", "lacteo", "carbo", "verdura", "otros"];

// ---- Genera lista de la compra agregada a partir de una lista de días ----
function buildShoppingList(dayNames) {
  const totals = {};
  dayNames.forEach((day) => {
    const plan = MEALS[day];
    Object.values(plan).forEach((meal) => {
      (meal.ingredients || []).forEach((ing) => {
        const key = ing.name + "|" + ing.unit;
        if (!totals[key]) totals[key] = { name: ing.name, unit: ing.unit, qty: 0, cat: ing.cat };
        totals[key].qty += ing.qty;
      });
    });
  });
  const byCat = {};
  CAT_ORDER.forEach((c) => (byCat[c] = []));
  Object.values(totals).forEach((item) => {
    item.qty = Math.round(item.qty * 10) / 10;
    byCat[item.cat].push(item);
  });
  CAT_ORDER.forEach((c) => byCat[c].sort((a, b) => a.name.localeCompare(b.name, "es")));
  return byCat;
}

// Precarga 3 semanas simuladas entrenando Miércoles/Viernes/Sábado, en el nuevo formato

function buildDaySession(dayKey, weekOffset) {
  const exercises = {};

    if (e.type === "time") {
      const dur = 32 + weekOffset * 4;
      exercises[e.name] = {

      };
    } else {
      const base = (BASE_WEIGHTS[dayKey][idx] || 40) + weekOffset * 2.5;
      exercises[e.name] = {
        completed: true,
        sets: Array.from({ length: e.setsCount }, (_, i) => ({
          w: Math.round(base * 2) / 2,
          r: 8 - (i === e.setsCount - 1 ? 1 : 0),
          roundTime: 28 + i * 4,
        })),
      };
    }
  });
  return { day: dayKey, exercises };
}

function getAudioContext() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === "suspended") {
    audioCtx.resume();
  }
  return audioCtx;
}

// Truco estándar para desbloquear audio en iOS: reproducir un buffer silencioso
// DENTRO del propio gesto táctil. resume() solo no siempre basta en WebKit.
function unlockAudio() {
  const ctx = getAudioContext();
  try {
    const buffer = ctx.createBuffer(1, 1, 22050);
    const source = ctx.createBufferSource();
    source.buffer = buffer;
    source.connect(ctx.destination);
    source.start(0);
  } catch (e) { /* seguimos sin sonido */ }
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden && audioCtx && audioCtx.state === "suspended") {
    audioCtx.resume();
  }
  if (!document.hidden && globalRestTimer) {
    renderGlobalRestBar(); // recalcula contra el reloj real al volver
  }
});

function playBeep() {
  try {
    const ctx = getAudioContext();
    const mk = (freq, delayMs, dur) => {
      setTimeout(() => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.28, ctx.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
        osc.start();
        osc.stop(ctx.currentTime + dur + 0.05);
      }, delayMs);
    };
    mk(880, 0, 0.5);
    mk(1046, 250, 0.4);
  } catch (e) { /* audio no disponible, seguimos sin sonido */ }
}

function getLastSession(dayKey, exerciseName) {
  const entries = Object.entries(store.workouts)
    .filter(([iso, w]) => w.day === dayKey)
    .sort((a, b) => (a[0] < b[0] ? 1 : -1));
  for (const [iso, w] of entries) {
    const savedEx = w.exercises && w.exercises[exerciseName];
    if (savedEx && savedEx.sets && savedEx.sets.some(Boolean)) {
      const doneSets = savedEx.sets.filter(Boolean);
      return { iso, lastSet: doneSets[doneSets.length - 1], sets: doneSets };
    }
  }
  return null;
}

// Sesión de hoy: se crea solo si no existe, nunca se pisa por completo.
// Cada serie se guarda de forma independiente -> añadir/quitar ejercicios nunca borra lo ya hecho.
function ensureTodaySession(dayKey) {
  const today = todayISO();
  if (!store.workouts[today]) {
    store.workouts[today] = { day: dayKey, exercises: {} };
    saveStore(store);
  }
  return store.workouts[today];
}

function adjustRest(dayKey, idx, delta) {
  const ex = store.workoutPlan[dayKey][idx];
  ex.rest = Math.min(300, Math.max(15, (ex.rest || 60) + delta));
  saveStore(store);
  const valEl = document.getElementById(`rest-value-${idx}`);
  if (valEl) valEl.textContent = `${ex.rest}s`;
}

// ---- Barra fija de descanso (global, no depende de qué tarjeta esté visible) ----
function startGlobalRestTimer(seconds, exerciseName) {
  unlockAudio();
  if (globalRestTimer) clearInterval(globalRestTimer.interval);
  globalRestTimer = { endsAt: Date.now() + seconds * 1000, exerciseName };
  saveGlobalRestTimer();
  document.getElementById("global-rest-bar").style.display = "block";
  renderGlobalRestBar();
  globalRestTimer.interval = setInterval(renderGlobalRestBar, 1000);
}

function saveGlobalRestTimer() {
  if (globalRestTimer) {
    localStorage.setItem("fitlog_rest_timer", JSON.stringify({ endsAt: globalRestTimer.endsAt, exerciseName: globalRestTimer.exerciseName }));
  } else {
    localStorage.removeItem("fitlog_rest_timer");
  }
}

function renderGlobalRestBar() {
  if (!globalRestTimer) return;
  const remaining = Math.round((globalRestTimer.endsAt - Date.now()) / 1000);
  const timeEl = document.getElementById("grb-time");
  const labelEl = document.getElementById("grb-label");
  if (!timeEl) return;
  if (remaining <= 0) {
    clearInterval(globalRestTimer.interval);
    timeEl.textContent = "¡Listo!";
    labelEl.textContent = globalRestTimer.exerciseName || "Descanso";
    playBeep();
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    setTimeout(() => {
      document.getElementById("global-rest-bar").style.display = "none";
      globalRestTimer = null;
      saveGlobalRestTimer();
    }, 3000);
    return;
  }
  const m = Math.floor(remaining / 60);
  const s = remaining % 60;
  timeEl.textContent = `${m}:${String(s).padStart(2, "0")}`;
  labelEl.textContent = globalRestTimer.exerciseName || "Descanso";
}

function cancelGlobalRestTimer() {
  if (globalRestTimer) clearInterval(globalRestTimer.interval);
  globalRestTimer = null;
  saveGlobalRestTimer();
  document.getElementById("global-rest-bar").style.display = "none";
}
document.getElementById("grb-cancel").addEventListener("click", cancelGlobalRestTimer);
document.getElementById("grb-plus30").addEventListener("click", () => {
  if (globalRestTimer) {
    globalRestTimer.endsAt += 30000;
    saveGlobalRestTimer();
    renderGlobalRestBar();
  }
});

// Al cargar la app: si había un descanso en marcha (aunque se recargara la página), lo recupera.
(function restoreRestTimer() {
  try {
    const saved = JSON.parse(localStorage.getItem("fitlog_rest_timer"));
    if (saved && saved.endsAt > Date.now()) {
      globalRestTimer = { endsAt: saved.endsAt, exerciseName: saved.exerciseName };
      document.getElementById("global-rest-bar").style.display = "block";
      renderGlobalRestBar();
      globalRestTimer.interval = setInterval(renderGlobalRestBar, 1000);
    } else {
      localStorage.removeItem("fitlog_rest_timer");
    }
  } catch (e) { /* nada que recuperar */ }
})();

// ---- Timer por serie (mide cuánto tarda cada serie; en ejercicios de tiempo ES la duración) ----
function startSetTimer(exIdx, setIdx, dayKey) {
  unlockAudio();
  const key = `${exIdx}-${setIdx}`;
  const row = document.querySelector(`[data-set="${key}"]`);
  if (!row) return;
  const startBtn = row.querySelector(".set-start-btn");
  const start = Date.now();
  setTimers[key] = { start };

  const doneBtn = document.createElement("button");
  doneBtn.className = "set-done-btn";
  doneBtn.innerHTML = `<span class="set-elapsed" id="elapsed-${key}">0:00</span>${ICON_CHECK}`;
  doneBtn.addEventListener("click", () => finishSet(exIdx, setIdx, dayKey));
  startBtn.replaceWith(doneBtn);

  setTimers[key].interval = setInterval(() => {
    const el = document.getElementById(`elapsed-${key}`);
    if (!el) { clearInterval(setTimers[key].interval); return; }
    const secs = Math.floor((Date.now() - start) / 1000);
    el.textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, "0")}`;
  }, 250);
}

function finishSet(exIdx, setIdx, dayKey) {
  const key = `${exIdx}-${setIdx}`;
  if (setTimers[key]) clearInterval(setTimers[key].interval);
  const elapsedSec = setTimers[key] ? Math.floor((Date.now() - setTimers[key].start) / 1000) : 0;
  delete setTimers[key];

  const ex = store.workoutPlan[dayKey][exIdx];
  const isTime = ex.type === "time";
  const session = ensureTodaySession(dayKey);
  if (!session.exercises[ex.name]) session.exercises[ex.name] = { completed: false, sets: [] };
  const savedEx = session.exercises[ex.name];

  let setData;
  if (isTime) {
    setData = { duration: elapsedSec };
  } else {
    const wInput = document.querySelector(`[data-set-weight="${key}"]`);
    const rInput = document.querySelector(`[data-set-reps="${key}"]`);
    setData = {
      w: parseFloat(wInput?.value) || 0,
      r: parseInt(rInput?.value, 10) || 0,
      roundTime: elapsedSec,
    };
  }
  savedEx.sets[setIdx] = setData;
  const setsCount = ex.setsCount || 3;
  savedEx.completed = savedEx.sets.filter(Boolean).length >= setsCount;
  saveStore(store);

  startGlobalRestTimer(ex.rest || 60, ex.name);
  renderExerciseCard(dayKey, exIdx); // solo repinta ESTA tarjeta, no toca timers de otras
}

function getDefaultWeight(savedSets, si, last) {
  for (let k = si - 1; k >= 0; k--) {
    if (savedSets[k]) return savedSets[k].w;
  }
  if (last && last.lastSet && typeof last.lastSet.w === "number") return last.lastSet.w;
  return "";
}

function renderSetRow(exIdx, setIdx, ex, savedSet, defaultWeight) {
  const key = `${exIdx}-${setIdx}`;
  const isTime = ex.type === "time";

  if (savedSet) {
    const resultText = isTime
      ? `${savedSet.duration}s`
      : `${savedSet.w}kg × ${savedSet.r}`;
    return `
      <div class="set-row done" data-set="${key}">
        <span class="set-num">S${setIdx + 1}</span>
        <span class="set-result">${resultText}</span>
        <span class="set-check-badge">${ICON_CHECK}</span>
      </div>`;
  }

  const startBtn = `<button class="set-start-btn" data-set-start="${key}" aria-label="Empezar serie ${setIdx + 1}">${ICON_PLAY}</button>`;

  if (isTime) {
    return `
      <div class="set-row" data-set="${key}">
        <span class="set-num">S${setIdx + 1}</span>
        <span class="set-hint">Mantener</span>
        ${startBtn}
      </div>`;
  }

  return `
    <div class="set-row" data-set="${key}">
      <span class="set-num">S${setIdx + 1}</span>
      <input type="number" step="0.5" inputmode="decimal" class="set-weight" data-set-weight="${key}" placeholder="kg" value="${defaultWeight}">
      <input type="number" inputmode="numeric" class="set-reps" data-set-reps="${key}" placeholder="reps">
      ${startBtn}
    </div>`;
}

function buildExerciseCardHTML(dayKey, exIdx) {
  const exList = store.workoutPlan[dayKey];
  const ex = exList[exIdx];
  const isTime = ex.type === "time";
  const restVal = ex.rest || 60;
  const setsCount = ex.setsCount || 3;

  const session = store.workouts[todayISO()];
  const savedEx = (session && session.exercises[ex.name]) || { completed: false, sets: [] };
  const last = getLastSession(dayKey, ex.name);

  const doneCount = savedEx.sets.filter(Boolean).length;
  const isCompleted = doneCount >= setsCount;

  let lastText;
  if (!last) {
    lastText = "Sin registros previos — anota tu primera marca";
  } else if (isTime) {
    lastText = `Última vez (${fmtDate(last.iso)}): ${last.lastSet.duration}s · ${last.sets.length} series`;
  } else {
    lastText = `Última vez (${fmtDate(last.iso)}): ${last.lastSet.w}kg x ${last.lastSet.r}`;
  }

  const setsHtml = Array.from({ length: setsCount }).map((_, si) => {
    const savedSet = savedEx.sets[si];
    const defaultWeight = getDefaultWeight(savedEx.sets, si, last);
    return renderSetRow(exIdx, si, ex, savedSet, defaultWeight);
  }).join("");

  return `
    <button class="ex-remove" data-remove="${exIdx}" aria-label="Quitar ejercicio">${ICON_X}</button>
    <div class="ex-name">${ex.name}${isCompleted ? `<span class="ex-done-badge">${ICON_CHECK} Hecho</span>` : ""}</div>
    <div class="ex-scheme">${ex.scheme}</div>
    <div class="ex-last">${lastText}</div>
    <div class="ex-rest-row">
      <span class="ex-rest-label">Descanso</span>
      <div class="ex-rest-stepper">
        <button type="button" data-rest-minus="${exIdx}" aria-label="Menos descanso">−</button>
        <span class="ex-rest-value" id="rest-value-${exIdx}">${restVal}s</span>
        <button type="button" data-rest-plus="${exIdx}" aria-label="Más descanso">+</button>
      </div>
    </div>
    <div class="sets-list">${setsHtml}</div>
  `;
}

function attachExerciseCardListeners(dayKey, exIdx) {
  const card = document.querySelector(`.exercise-row[data-ex="${exIdx}"]`);
  if (!card) return;

  card.querySelector(`[data-remove="${exIdx}"]`)?.addEventListener("click", () => {
    store.workoutPlan[dayKey].splice(exIdx, 1);
    saveStore(store);
    renderWorkoutView(dayKey);
  });

  card.querySelector(`[data-rest-minus="${exIdx}"]`)?.addEventListener("click", () => adjustRest(dayKey, exIdx, -15));
  card.querySelector(`[data-rest-plus="${exIdx}"]`)?.addEventListener("click", () => adjustRest(dayKey, exIdx, 15));

  card.querySelectorAll("[data-set-start]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const [ei, si] = btn.dataset.setStart.split("-").map(Number);
      startSetTimer(ei, si, dayKey);
    });
  });
}

function renderExerciseCard(dayKey, exIdx) {
  const card = document.querySelector(`.exercise-row[data-ex="${exIdx}"]`);
  const ex = store.workoutPlan[dayKey][exIdx];
  const session = store.workouts[todayISO()];
  const savedEx = (session && session.exercises[ex.name]) || { completed: false, sets: [] };
  const isCompleted = savedEx.sets.filter(Boolean).length >= (ex.setsCount || 3);
  if (!card) return;
  card.classList.toggle("completed", isCompleted);
  card.innerHTML = buildExerciseCardHTML(dayKey, exIdx);
  attachExerciseCardListeners(dayKey, exIdx);
}

function renderWorkoutView(dayKey) {
  currentWorkoutDay = dayKey;
  document.getElementById("workout-pills").innerHTML = Object.keys(WORKOUTS).map(
    (k) => `<button class="pill ${k === dayKey ? "active" : ""}" data-day="${k}">${WORKOUTS[k].name}</button>`
  ).join("");

  const dayName = WORKOUTS[dayKey].name;
  const exList = store.workoutPlan[dayKey];
  ensureTodaySession(dayKey);

  const cardsHtml = exList.map((ex, i) => `<div class="exercise-row" data-ex="${i}"></div>`).join("");

  document.getElementById("workout-card").innerHTML = `
    <h2>${dayName} <span class="tag">${todayISO()}</span></h2>
    ${cardsHtml || '<p class="empty-note">Sin ejercicios en este día — añade alguno abajo.</p>'}

    <div class="add-exercise">
      <div class="add-exercise-inputs">
        <input type="text" id="new-ex-name" placeholder="Nombre del ejercicio">
        <input type="text" id="new-ex-scheme" placeholder="Series x reps (ej. 3 x 10-12)">
        <select id="new-ex-type">
          <option value="reps">Reps y peso</option>
          <option value="time">Tiempo (ej. plancha)</option>
        </select>
        <div class="add-exercise-row2">
          <input type="number" id="new-ex-sets" placeholder="Nº series" value="3" min="1" max="10">
          <input type="number" id="new-ex-rest" placeholder="Descanso (seg)" value="60">
        </div>
      </div>
      <button class="ghost" id="add-exercise-btn" style="width:100%;">+ Añadir ejercicio</button>
    </div>
    <button class="ghost" id="reset-day-btn" style="width:100%;margin-top:8px;">Restaurar plantilla original de ${dayName}</button>
  `;

  exList.forEach((_, i) => renderExerciseCard(dayKey, i));

  document.querySelectorAll("#workout-pills .pill").forEach((p) => {
    p.addEventListener("click", () => renderWorkoutView(p.dataset.day));
  });

  document.getElementById("add-exercise-btn").addEventListener("click", () => {
    const nameInput = document.getElementById("new-ex-name");
    const schemeInput = document.getElementById("new-ex-scheme");
    const typeSel = document.getElementById("new-ex-type");
    const setsInput = document.getElementById("new-ex-sets");
    const restInput = document.getElementById("new-ex-rest");
    const name = nameInput.value.trim();
    const scheme = schemeInput.value.trim() || "3 x 10-12";
    const type = typeSel.value;
    const setsCount = parseInt(setsInput.value, 10) || 3;
    const rest = parseInt(restInput.value, 10) || 60;
    if (!name) { nameInput.focus(); return; }
    // Solo modifica la plantilla (workoutPlan); las series ya guardadas de otros
    // ejercicios viven en session.exercises por nombre y no se tocan aquí.
    store.workoutPlan[dayKey].push({ name, scheme, type, rest, setsCount });
    saveStore(store);
    renderWorkoutView(dayKey);
  });

  document.getElementById("reset-day-btn").addEventListener("click", () => {
    store.workoutPlan[dayKey] = WORKOUTS[dayKey].exercises.map((e) => ({ ...e }));
    saveStore(store);
    renderWorkoutView(dayKey);
  });
}

function renderWeightView() {
  const input = document.getElementById("weight-input");
  document.getElementById("weight-save").onclick = () => {
    const v = parseFloat(input.value);
    if (isNaN(v) || v <= 0) return;
    store.weights.push({ date: todayISO(), w: v });
    store.weights.sort((a, b) => (a.date < b.date ? -1 : 1));
    saveStore(store);
    input.value = "";
    drawWeightChart();
    renderWeightHistory();
    renderHoy();
  };
  drawWeightChart();
  renderWeightHistory();
}

function renderWeightHistory() {
  const el = document.getElementById("weight-history");
  if (!store.weights.length) {
    el.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v4l3 2"/></svg></div>
        <p class="empty-note">Aún no hay pesadas registradas.</p>
      </div>`;
    return;
  }
  const rows = [...store.weights].reverse().slice(0, 20).map(
    (w) => `<div class="wh-row"><span>${fmtDate(w.date)}</span><span>${w.w} kg</span></div>`
  ).join("");
  el.innerHTML = rows;
}

function movingAverage(arr, windowSize) {
  return arr.map((_, i) => {
    const start = Math.max(0, i - windowSize + 1);
    const slice = arr.slice(start, i + 1);
    const avg = slice.reduce((s, p) => s + p.w, 0) / slice.length;
    return avg;
  });
}

function drawWeightChart() {
  const canvas = document.getElementById("weight-chart");
  const ctx = canvas.getContext("2d");
  const rect = canvas.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, rect.width, rect.height);

  const data = store.weights;
  const trendEl = document.getElementById("weight-trend");

  if (data.length < 2) {
    ctx.fillStyle = "#8891a8";
    ctx.font = "12px Inter, sans-serif";
    ctx.fillText("Registra al menos 2 pesadas para ver la tendencia", 10, rect.height / 2);
    trendEl.innerHTML = "";
    return;
  }

  const avg = movingAverage(data, 5);
  const pad = 16;
  const w = rect.width - pad * 2;
  const h = rect.height - pad * 2;

  const allVals = data.map((p) => p.w).concat(avg);
  const min = Math.min(...allVals) - 0.3;
  const max = Math.max(...allVals) + 0.3;
  const xStep = w / (data.length - 1);
  const yPos = (v) => pad + h - ((v - min) / (max - min)) * h;

  // raw points (dim)
  ctx.strokeStyle = "#2a324a";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  data.forEach((p, i) => {
    const x = pad + i * xStep;
    const y = yPos(p.w);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();

  // moving average (accent)
  ctx.strokeStyle = "#e8a33d";
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  avg.forEach((v, i) => {
    const x = pad + i * xStep;
    const y = yPos(v);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();

  // last point dot
  const lastX = pad + (data.length - 1) * xStep;
  const lastY = yPos(avg[avg.length - 1]);
  ctx.fillStyle = "#e8a33d";
  ctx.beginPath();
  ctx.arc(lastX, lastY, 3.5, 0, Math.PI * 2);
  ctx.fill();

  const first = avg[0];
  const last = avg[avg.length - 1];
  const delta = (last - first).toFixed(1);
  const sign = delta >= 0 ? "+" : "";
  trendEl.innerHTML = `
    <span>Media móvil (5 pesadas): <b>${last.toFixed(1)} kg</b></span>
    <span>Cambio en el periodo: <b>${sign}${delta} kg</b></span>
  `;
}

window.addEventListener("resize", () => {
  if (document.getElementById("view-peso").classList.contains("active")) drawWeightChart();
});
